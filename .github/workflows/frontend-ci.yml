name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-analyze-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)\.env($|\.)'; then
            echo 'A real .env file is tracked by Git.'
            exit 1
          fi
          patterns='FLWSECK(_TEST)?-[A-Za-z0-9_-]{16,}|GOCSPX-[A-Za-z0-9_-]{20,}|1//[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|postgres(ql)?://[^[:space:]/:]+:[^[:space:]@]+@'
          if git grep -I -n -E "$patterns" -- .; then
            echo 'Possible credential material found in tracked files.'
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Build release web app
        run: flutter build web --release --pwa-strategy=none --no-web-resources-cdn
