<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UniCart campus group buying for PAU students.">
  <meta name="theme-color" content="#050B18">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UniCart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://unicart-backend-v6u9.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="//unicart-backend-v6u9.onrender.com">

  <title>UniCart</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050B18;
      color: #F8FAFC;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    #unicart-boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(37, 99, 235, 0.14), transparent 34%),
        #050B18;
      z-index: 0;
    }

    .unicart-boot-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: .96;
    }

    .unicart-boot-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      border: 1px solid #1E3A5F;
      background: #0D1526;
      color: #60A5FA;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 16px 40px rgba(37, 99, 235, .16);
    }

    .unicart-boot-title {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.3px;
    }

    .unicart-boot-subtitle {
      color: #94A3B8;
      font-size: 13px;
    }

    .unicart-boot-spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #1E3A5F;
      border-top-color: #60A5FA;
      border-radius: 999px;
      animation: unicart-spin .8s linear infinite;
    }

    @keyframes unicart-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="unicart-boot">
    <div class="unicart-boot-card">
      <div class="unicart-boot-mark">U</div>
      <div class="unicart-boot-title">UniCart</div>
      <div class="unicart-boot-spinner"></div>
      <div class="unicart-boot-subtitle">Opening your campus marketplace</div>
    </div>
  </div>

  <script>
    window.addEventListener("flutter-first-frame", function () {
      const boot = document.getElementById("unicart-boot");
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
