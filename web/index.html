<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="UniCart campus group buying for PAU students.">
  <meta name="theme-color" content="#050B18">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UniCart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://unicart-backend-v6u9.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="//unicart-backend-v6u9.onrender.com">
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <title>UniCart</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      background: #050B18;
      color: #F8FAFC;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #unicart-boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px
        max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 38%, rgba(37, 99, 235, 0.18), transparent 34%),
        #050B18;
      z-index: 2147483647;
    }

    .unicart-boot-card {
      width: min(92vw, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      opacity: 0.98;
    }

    .unicart-boot-mark {
      width: clamp(88px, 20vw, 112px);
      height: clamp(88px, 20vw, 112px);
      display: grid;
      place-items: center;
      padding: clamp(12px, 3vw, 17px);
      box-sizing: border-box;
      border-radius: clamp(22px, 5vw, 30px);
      border: 1px solid #1E3A5F;
      background: linear-gradient(145deg, #10203A, #0A1425);
      box-shadow: 0 20px 52px rgba(37, 99, 235, 0.20);
    }

    .unicart-boot-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .unicart-boot-title {
      margin-top: 2px;
      font-size: clamp(24px, 5.5vw, 30px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .unicart-boot-subtitle {
      max-width: 320px;
      color: #94A3B8;
      font-size: clamp(14px, 3.6vw, 16px);
      line-height: 1.45;
    }

    .unicart-boot-spinner {
      width: clamp(28px, 7vw, 34px);
      height: clamp(28px, 7vw, 34px);
      border: 3px solid #1E3A5F;
      border-top-color: #60A5FA;
      border-radius: 999px;
      animation: unicart-spin .72s linear infinite;
    }

    #unicart-install {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 2147483000;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid #1E3A5F;
      background: #0A1425;
      color: #F8FAFC;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      font-size: 14px;
      line-height: 1.35;
      max-width: 480px;
      margin: 0 auto;
    }
    #unicart-install b { display: block; font-size: 15px; }
    #unicart-install span { color: #94A3B8; }
    #unicart-install button {
      border: 0; border-radius: 12px; cursor: pointer;
      padding: 10px 14px; font-weight: 700; font-size: 14px;
    }
    #unicart-install-go { background: #2563EB; color: #fff; }
    #unicart-install-x { background: transparent; color: #94A3B8; padding: 10px 8px; }

    @keyframes unicart-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    (function () {
      const nativeOpen = window.open.bind(window);
      window.open = function (url, target, features) {
        let opened = null;
        try {
          opened = nativeOpen(url, target, features);
        } catch (_) {}

        if (!opened && target === "_blank" && typeof url === "string" && url.startsWith("https://")) {
          window.location.assign(url);
          return window;
        }
        return opened;
      };

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          })
          .catch(function () {});
      }

      if ("caches" in window) {
        caches.keys()
          .then(function (keys) {
            return Promise.all(
              keys
                .filter(function (key) { return key.toLowerCase().includes("flutter"); })
                .map(function (key) { return caches.delete(key); })
            );
          })
          .catch(function () {});
      }

      fetch("https://unicart-backend-v6u9.onrender.com/health", {
        mode: "no-cors",
        cache: "no-store",
        credentials: "omit"
      }).catch(function () {});
    })();
  </script>
</head>
<body>
  <div id="unicart-boot">
    <div class="unicart-boot-card">
      <div class="unicart-boot-mark">
        <img src="assets/assets/images/logo.png" alt="UniCart logo" fetchpriority="high">
      </div>
      <div class="unicart-boot-title">UniCart</div>
      <div class="unicart-boot-spinner" aria-hidden="true"></div>
      <div class="unicart-boot-subtitle">Opening your campus marketplace</div>
    </div>
  </div>

  <script>
    window.addEventListener("flutter-first-frame", function () {
      const boot = document.getElementById("unicart-boot");
      if (boot) boot.remove();
    });

    setTimeout(function () {
      const boot = document.getElementById("unicart-boot");
      const subtitle = document.querySelector(".unicart-boot-subtitle");
      if (boot && subtitle) {
        subtitle.textContent = "Still loading. Check your connection, then refresh this page.";
      }
    }, 15000);
  </script>
  <div id="unicart-install" role="dialog" aria-label="Install UniCart">
    <div style="flex:1">
      <b>Get the UniCart app</b>
      <span id="unicart-install-text">Add UniCart to your home screen.</span>
    </div>
    <button id="unicart-install-go" type="button">Install</button>
    <button id="unicart-install-x" type="button" aria-label="Dismiss">Not now</button>
  </div>
  <script>
    (function () {
      var KEY = "unicart_install_dismissed";
      var box = document.getElementById("unicart-install");
      var go = document.getElementById("unicart-install-go");
      var text = document.getElementById("unicart-install-text");
      var deferred = null;

      function standalone() {
        return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
          window.navigator.standalone === true;
      }
      function dismissed() {
        try { return localStorage.getItem(KEY) === "1"; } catch (_) { return false; }
      }
      function show() {
        if (standalone() || dismissed()) return;
        box.style.display = "flex";
      }
      function hide(remember) {
        box.style.display = "none";
        if (remember) { try { localStorage.setItem(KEY, "1"); } catch (_) {} }
      }

      document.getElementById("unicart-install-x").addEventListener("click", function () { hide(true); });

      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferred = e;
        setTimeout(show, 4000);
      });
      go.addEventListener("click", function () {
        if (!deferred) { hide(true); return; }
        deferred.prompt();
        deferred.userChoice.finally(function () { deferred = null; hide(true); });
      });
      window.addEventListener("appinstalled", function () { hide(true); });

      // iPhone/iPad Safari has no install prompt: show manual steps instead.
      var ua = navigator.userAgent || "";
      var isIOS = /iphone|ipad|ipod/i.test(ua);
      var isSafari = /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);
      if (isIOS && isSafari) {
        text.textContent = "Tap the Share button, then \u201cAdd to Home Screen\u201d.";
        go.style.display = "none";
        setTimeout(show, 6000);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
